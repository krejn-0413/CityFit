    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="CityFit 城宜 - 找到你的灵魂城市！18道趣味问答+八字玄学，发现与你最契合的城市。" />
    <meta name="theme-color" content="#FF6B6B" />
    <title>CityFit 城宜 - 找到你的灵魂城市</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      (function() {
        // ── Debug: ?nobg disables woven background ──
        if (/[?&]nobg/.test(location.search) || /[?&]nobg/.test(location.hash)) {
          document.documentElement.classList.add('no-bg');
        }
        // ── Ripple ──
        function triggerRipple(e) {
          var x, y;
          if (e.touches) {
            x = e.touches[0].clientX;
            y = e.touches[0].clientY;
          } else {
            x = e.clientX;
            y = e.clientY;
          }
          var dot = document.createElement('div');
          dot.className = 'ripple-dot';
          dot.style.left = x + 'px';
          dot.style.top = y + 'px';
          dot.style.width = '16px';
          dot.style.height = '16px';
          document.body.appendChild(dot);
          dot.addEventListener('animationend', function() {
            dot.remove();
          });
        }
        document.addEventListener('click', triggerRipple, { passive: true });
        document.addEventListener('touchstart', triggerRipple, { passive: true });
      })();
    </script>
  </body>
</html>
